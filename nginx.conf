server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Angular owns routing: unknown paths must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API traffic to the backend so the browser sees a single origin and
    # no CORS preflight is needed in the container deployment.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        proxy_pass       http://backend:8080/actuator/;
        proxy_set_header Host $host;
    }

    # Hashed build artefacts are immutable, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point must never be cached, or clients would keep an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
