<div class="shell">
  <app-sidebar [open]="menuOpen()" (navigate)="closeMenu()" />

  @if (menuOpen()) {
    <div class="backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }

  <div class="main">
    <app-navbar (toggleMenu)="toggleMenu()" />

    <main class="content" [class.with-player]="playerVisible()">
      <router-outlet />
    </main>
  </div>
</div>

<app-music-player />

<!-- Asks which playlist to save into, when there is more than one. -->
<app-playlist-picker />

@if (quickAdd.notice(); as message) {
  <div class="toast" role="status" aria-live="polite">{{ message }}</div>
}
